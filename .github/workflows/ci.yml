name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [prod]
  # Deploy calls this before build/cutover on prod.
  workflow_call:

jobs:
  readiness:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acs_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "26.2.5"
          elixir-version: "1.17.3"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-readiness-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-readiness-
            ${{ runner.os }}-mix-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Install dependencies
        run: mix deps.get

      - name: Run repository readiness checks
        run: ./scripts/repo-readiness.sh
        env:
          TEST_DATABASE_URL: ecto://postgres:postgres@localhost:5432/acs_test
          RELEASE_DATABASE_URL: ecto://postgres:ci_release_password@localhost:5432/acs_prod
