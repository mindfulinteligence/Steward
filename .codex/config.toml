# Project-local Codex MCP configuration.
# Activate this file with: CODEX_HOME="$PWD/.codex" codex

# Fixed loopback port for OAuth callback. Codex otherwise binds an ephemeral
# port per login attempt; Auth0 requires the EXACT redirect_uri be allowlisted
# (no path wildcards), so the port must be stable. The callback path suffix is a
# deterministic per-server hash (base64url of sha256(server_url)[0..9]).
mcp_oauth_callback_port = 19876

[mcp_servers.acs]
url = "http://localhost:4001/mcp/v1/messages"

[mcp_servers.acs.http_headers]
"x-api-key" = "{env:MCP_API_KEY}"

[mcp_servers.acs.tools.claim_work]
approval_mode = "approve"

[mcp_servers.acs.tools.connection_diagnostic]
approval_mode = "approve"

[mcp_servers.acs.tools.specs_propose]
approval_mode = "approve"

[mcp_servers.steward]
url = "https://anantha.stewardacs.xyz/mcp/sse"

[mcp_servers.steward.tools.claim_work]
approval_mode = "approve"

[mcp_servers.steward.tools.connection_diagnostic]
approval_mode = "approve"

[mcp_servers.steward.tools.specs_propose]
approval_mode = "approve"

[mcp_servers.steward.tools.create_work]
approval_mode = "approve"

[mcp_servers.steward.tools.app_list]
approval_mode = "approve"

[mcp_servers.steward.tools.release_work]
approval_mode = "approve"

[mcp_servers.steward.tools.submit_task_feedback]
approval_mode = "approve"

[mcp_servers.steward.tools.skill_save]
approval_mode = "approve"

[mcp_servers.steward.tools.get_started]
approval_mode = "approve"

[mcp_servers.steward.tools.query_specs]
approval_mode = "approve"

[mcp_servers.steward.tools.lock_file]
approval_mode = "approve"

[mcp_servers.steward.tools.unlock_file]
approval_mode = "approve"

[mcp_servers.steward.tools.specs_get]
approval_mode = "approve"

[mcp_servers.steward.tools.skill_get]
approval_mode = "approve"

[mcp_servers.steward.tools.ask]
approval_mode = "approve"

[mcp_servers.steward.tools.save_memory]
approval_mode = "approve"

[mcp_servers.steward.tools.query_memories]
approval_mode = "approve"

[mcp_servers.steward.tools.set_memory_status]
approval_mode = "approve"

[mcp_servers.steward.tools.list_tasks]
approval_mode = "approve"

[mcp_servers.axiom]
url = "https://mcp.axiom.co/mcp"

[mcp_servers.infisical]
command = "npx"
args = ["-y", "@infisical/mcp"]

[mcp_servers.infisical.env]
INFISICAL_HOST_URL = "https://app.infisical.com"
INFISICAL_AUTH_METHOD = "universal-auth"
INFISICAL_UNIVERSAL_AUTH_CLIENT_ID = "{env:INFISICAL_UNIVERSAL_AUTH_CLIENT_ID}"
INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET = "{env:INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET}"
