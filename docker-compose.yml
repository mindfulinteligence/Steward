# Local development only — production uses docker-compose.multitenant.yml
services:
  steward_acs:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: steward_acs:local
    container_name: steward_acs
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      MIX_ENV: dev
      PORT: "4001"
      ACS_ORG_NAME: default
      ACS_PROJECT_NAME: steward
      # Local is always SQLite — never inherit Neon DATABASE_URL from a host .env
      DATABASE_PATH: /app/priv/acs.sqlite
      DATABASE_URL: ""
      ENABLED_LLM_PROVIDERS: "${ENABLED_LLM_PROVIDERS:-tokenrouter}"
      MCP_AUTH_LOCAL_FALLBACK: "false"
      META_HARNESS_ENABLED: "true"

      # OAuth / Auth0 (for Claude Connectors)
      OAUTH_BEARER_ENABLED: "${OAUTH_BEARER_ENABLED:-false}"
      AUTH0_DOMAIN: "${AUTH0_DOMAIN:-}"
      AUTH0_AUDIENCE: "${AUTH0_AUDIENCE:-}"
      MCP_PUBLIC_URL: "${MCP_PUBLIC_URL:-}"
      MCP_RESOURCE_URL: "${MCP_RESOURCE_URL:-}"
      AUTH0_CONNECTION: "${AUTH0_CONNECTION:-}"

      # Dashboard auth: local single-tenant is username/password (ACS_USERNAME/ACS_PASSWORD).
      # Never enable Auth0 OIDC here — that is multi-tenant prod only.
      ACCOUNT_HOST: "localhost"
      OIDC_BROWSER_ENABLED: "false"
      AUTH0_WEB_CLIENT_ID: ""
      AUTH0_WEB_CLIENT_SECRET: ""
      AUTH0_WEB_REDIRECT_URI: ""
      ACS_USERNAME: "${ACS_USERNAME:-admin}"
      ACS_PASSWORD: "${ACS_PASSWORD:-admin}"
      SELF_SERVICE_ORGS_ENABLED: "false"

      # MCP API key for tool calls (optional in dev, required in prod)
      MCP_API_KEY: "${MCP_API_KEY:-dev-api-key}"

      # MCP tool definitions directory
      # Create YAML tool files in ./acstools/ on the host and point here:
      MCP_TOOLS_PATH: "${MCP_TOOLS_PATH:-/app/acs/acstools}"

      # LLM provider API keys (enable memory auditing and semantic search)
      # At least one provider key is needed for memory features to work:
      NIM_API_KEY: "${NIM_API_KEY:-}"
      NIM_MODEL: "${NIM_MODEL:-}"
      NIM_BASE_URL: "${NIM_BASE_URL:-}"
      TOKENROUTER_API_KEY: "${TOKENROUTER_API_KEY:-}"
      MINIMAX_API_KEY: "${MINIMAX_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      TOKENROUTER_MODEL: "${TOKENROUTER_MODEL:-z-ai/glm-5.3-free}"

      # Per-location, per-call-type LLM routing (see Acs.LLM.Router).
      ACS_REGION: "${ACS_REGION:-default}"
      LLM_PRIORITY_INTAKE: "${LLM_PRIORITY_INTAKE:-}"
      LLM_PRIORITY_SKILL_INTAKE: "${LLM_PRIORITY_SKILL_INTAKE:-}"
      LLM_MODEL_INTAKE: "${LLM_MODEL_INTAKE:-}"
    volumes:
      # Uncomment to mount Obsidian vault:
      # - /path/to/your/vault:/obsidian:ro
      - acs_data:/app/priv
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/mcp/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  acs_data:
